<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <h1>Number Guessing Game</h1>
    <p>Pick any number from 1 to 100</p>

    <input id="guess">
    <button onclick="checkGuess()">Guess</button>

    <p id="message"></p>

    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let tries = 0;

        function checkGuess() {
            let guess = Number(document.getElementById("guess").value);
            tries = tries + 1;

            if (guess < secretNumber) {
                document.getElementById("message").innerText = "The number is higher";
            } else if (guess > secretNumber) {
                document.getElementById("message").innerText = "The number is lower";
            } else {
                document.getElementById("message").innerText = "You got it! It took you " + tries + " tries.";
            }
        }
    </script>
</body>
</html>
